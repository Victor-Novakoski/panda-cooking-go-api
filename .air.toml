root = "."
tmp_dir = ".air"

[build]
  pre_cmd = ["docker compose up -d"]
  post_cmd = ["docker compose down"]
  cmd = "go build -o ./.air/api ./cmd/main.go"
  bin = "./.air/api"
  delay = 1000
  exclude_dir = [".air", "vendor"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "toml", "env"]
  kill_delay = "200ms"
  log = ".air/build-errors.log"
  stop_on_error = true

[log]
  time = false

[color]
  build = "yellow"
  runner = "green"
  watcher = "cyan"
  app = ""
