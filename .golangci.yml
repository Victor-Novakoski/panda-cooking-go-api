version: "2"

run:
  # analisa também os testes de integração
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - gosec
    - revive
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - panda-cooking-go-api
